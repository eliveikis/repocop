# Whether a turn's first shell command showed the current branch: `git status` in its long form
# or with -b, `git branch` listing branches or with --show-current, `git rev-parse --abbrev-ref
# HEAD` or `git symbolic-ref HEAD`, with or without git's own options before the command.

name = "first shell command showed the current branch"
first_command = '''(?x)
  \bgit (?: \s+ (?: -C \s+ \S+ | -c \s+ \S+ | --[\w-]+ (?:=\S+)? ) )* \s+
  (?:
      status \b (?! [^;&|\n]* \s (?: --porcelain | --short | -[a-zA-Z]*s ) )
    | status \b [^;&|\n]* \s (?: --branch \b | -[a-zA-Z]*b )
    | branch (?: \s+ -\S+ )* \s* (?: $ | [;&|)\n] )
    | branch \b [^;&|\n]* \s --list \b
    | rev-parse \b [^;&|\n]* --abbrev-ref [^;&|\n]* \b HEAD \b
    | symbolic-ref \b [^;&|\n]* \b HEAD \b
  )
'''
