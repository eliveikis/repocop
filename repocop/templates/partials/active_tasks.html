<div id="active-tasks"{% if active_tasks %} hx-get="{{ url_for('active_tasks_panel') }}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
{% if active_tasks %}
<ul class="nav-list nav-tasks" aria-labelledby="nav-active">
  {% for entry in active_tasks %}
  <li><a id="active-task-{{ entry.task.id }}" href="{{ url_for('task_page', task_id=entry.task.id) }}">
    <span class="nav-task-name">#{{ entry.task.id }} · {{ entry.task.workflow }} <span class="status status-{{ entry.task.status }}">{{ entry.task.status }}</span></span>
    <span class="nav-task-meta">{{ entry.repository }}{% if entry.requirement %} · {{ entry.requirement }}{% endif %}</span>
  </a></li>
  {% endfor %}
</ul>
{% else %}
<p class="nav-empty">Nothing running.</p>
{% endif %}
</div>
