{% if waiting %}<a class="status status-behind" href="{{ url_for('task_page', task_id=waiting.id) }}">sync #{{ waiting.id }} not on {{ repo.default_branch }}</a>{% elif status == "behind" %}<a class="status status-behind" href="{{ url_for('template_sync_page', repository_id=repo.id) }}">behind the template</a>{% elif status == "no_commits" %}<span class="status status-no_commits">needs a first commit</span>{% else %}<span class="status status-{{ status }}">{{ status }}</span>{% endif %}
